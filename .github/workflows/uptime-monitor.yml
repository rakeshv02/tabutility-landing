name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:           # allow manual trigger

jobs:
  check-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check all 113 tool subdomains
        id: check
        run: |
          TOOLS=(
            percentage-calculator bmi-calculator age-calculator tip-calculator
            loan-calculator discount-calculator mortgage-calculator rent-vs-buy
            compound-interest-calculator credit-card-payoff-calculator
            savings-goal-calculator retirement-calculator annuity-calculator
            debt-payoff net-worth emergency-fund inflation roi apr investment
            break-even fuel-cost hourly-to-salary overtime payrise
            currency-converter json-formatter word-unscrambler base64-encoder
            url-encoder password-generator uuid-generator markdown-to-html
            qr-code-generator word-counter unit-converter image-compressor
            meditation-timer tdee-calculator vat-calculator gst-calculator
            uk-salary-calculator uk-student-loan uk-maternity-pay
            uk-capital-gains-tax uk-self-employed-tax uk-ir35-calculator
            uk-stamp-duty-calculator uk-dividend-tax uk-inheritance-tax
            uk-pension-tax-relief uk-corporation-tax uk-national-insurance
            rental-yield rental-income-tax buy-to-let-stamp-duty
            us-paycheck-calculator us-capital-gains-tax us-self-employment-tax
            us-401k australian-tax-calculator australia-hecs-calculator
            australia-stamp-duty australia-super australia-lmi-calculator
            australia-points-test canadian-tax-calculator canada-rrsp
            canada-land-transfer-tax canada-express-entry uae-salary-calculator
            schengen-calculator ireland-income-tax nz-income-tax
            germany-income-tax netherlands-income-tax singapore-income-tax
            south-africa-income-tax spain-income-tax stopwatch countdown-timer
            pomodoro-timer alarm-clock name-picker coin-flip dice-roller
            random-number-generator typing-speed-test metronome yes-or-no
            tally-counter scientific-calculator sales-tax-calculator
            gpa-calculator body-fat-calculator due-date-calculator
            sleep-calculator car-lease-calculator grade-calculator
            water-intake-calculator mortgage-overpayment-calculator
            budget-planner crypto-tax-calculator
            date-difference-calculator percentage-change-calculator
            time-zone-converter hex-to-rgb split-bill-calculator
            calorie-deficit-calculator period-calculator amortization-schedule
            mortgage-affordability-calculator uk-child-benefit-calculator
          )

          BROKEN=()
          for tool in "${TOOLS[@]}"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$tool.tabutility.com")
            if [ "$status" != "200" ]; then
              BROKEN+=("$tool (HTTP $status)")
              echo "❌ $tool → $status"
            else
              echo "✅ $tool → 200"
            fi
          done

          if [ ${#BROKEN[@]} -gt 0 ]; then
            echo "broken_count=${#BROKEN[@]}" >> $GITHUB_OUTPUT
            printf '%s\n' "${BROKEN[@]}" > /tmp/broken.txt
            echo "broken_list<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/broken.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "broken_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Open issue if tools are down
        if: steps.check.outputs.broken_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const brokenCount = ${{ steps.check.outputs.broken_count }};
            const brokenList = `${{ steps.check.outputs.broken_list }}`;
            const title = `🚨 ${brokenCount} tool(s) down – ${new Date().toISOString().slice(0,16)} UTC`;
            const body = `## Tools returning non-200 responses\n\n\`\`\`\n${brokenList}\n\`\`\`\n\nCheck Vercel dashboard and Cloudflare DNS. This issue auto-closes when all tools are back to 200.`;

            // Check if there's already an open uptime issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime-alert',
              state: 'open'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime-alert']
              });
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `**Update ${new Date().toISOString().slice(0,16)} UTC** — still down:\n\`\`\`\n${brokenList}\n\`\`\``
              });
            }

      - name: Close resolved issue if all tools are up
        if: steps.check.outputs.broken_count == 0
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime-alert',
              state: 'open'
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ All 113 tools are back to HTTP 200 as of ${new Date().toISOString().slice(0,16)} UTC. Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
