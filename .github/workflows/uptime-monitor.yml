name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:           # allow manual trigger

jobs:
  check-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check all tool URLs from tools.config.json
        id: check
        run: |
          # Derive tool list from tools.config.json so it never goes stale
          jq -r '.[] | .url' tools.config.json > /tmp/urls.txt
          TOTAL=$(wc -l < /tmp/urls.txt)
          echo "Checking $TOTAL tools in parallel..."

          check_url() {
            url="$1"
            tool="${url#https://}"
            tool="${tool%%.tabutility.com*}"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$url")
            if [ "$status" != "200" ]; then
              echo "BROKEN $tool (HTTP $status)"
            else
              echo "OK $tool"
            fi
          }
          export -f check_url

          xargs -a /tmp/urls.txt -P 40 -I{} bash -c 'check_url "$@"' _ {} > /tmp/results.txt

          grep '^OK '     /tmp/results.txt | sed 's/^OK /✅ /' || true
          grep '^BROKEN ' /tmp/results.txt | sed 's/^BROKEN /❌ /' || true

          CHECKED=$(wc -l < /tmp/results.txt)
          echo "Checked $CHECKED of $TOTAL tools."
          if [ "$CHECKED" != "$TOTAL" ]; then
            echo "::error::Only $CHECKED of $TOTAL tools were checked"
            exit 1
          fi

          grep '^BROKEN ' /tmp/results.txt | sed 's/^BROKEN //' | sort > /tmp/broken.txt || true
          BROKEN_COUNT=$(wc -l < /tmp/broken.txt)

          echo "total_count=$TOTAL" >> $GITHUB_OUTPUT
          if [ "$BROKEN_COUNT" -gt 0 ]; then
            echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT
            echo "broken_list<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/broken.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "broken_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Open issue if tools are down
        if: steps.check.outputs.broken_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const brokenCount = ${{ steps.check.outputs.broken_count }};
            const brokenList = `${{ steps.check.outputs.broken_list }}`;
            const title = `🚨 ${brokenCount} tool(s) down – ${new Date().toISOString().slice(0,16)} UTC`;
            const body = `## Tools returning non-200 responses\n\n\`\`\`\n${brokenList}\n\`\`\`\n\nCheck Vercel dashboard and Cloudflare DNS. This issue auto-closes when all tools are back to 200.`;

            // Check if there's already an open uptime issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime-alert',
              state: 'open'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime-alert']
              });
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `**Update ${new Date().toISOString().slice(0,16)} UTC** — still down:\n\`\`\`\n${brokenList}\n\`\`\``
              });
            }

      - name: Close resolved issue if all tools are up
        if: steps.check.outputs.broken_count == 0
        uses: actions/github-script@v7
        with:
          script: |
            const totalCount = `${{ steps.check.outputs.total_count }}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime-alert',
              state: 'open'
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ All ${totalCount} tools are back to HTTP 200 as of ${new Date().toISOString().slice(0,16)} UTC. Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
