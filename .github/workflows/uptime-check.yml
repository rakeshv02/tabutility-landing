name: Tool Uptime Check

on:
  schedule:
    # Runs daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # allow manual triggers

permissions:
  issues: write
  contents: write

jobs:
  check-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all tool URLs
        id: check
        run: |
          node scripts/check-uptime.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/status.json
          git diff --cached --quiet || git commit -m "chore: update status.json [skip ci]"
          git push

      - name: Report failures as GitHub issue
        if: steps.check.outputs.failures != ''
        uses: actions/github-script@v7
        with:
          script: |
            const failures = JSON.parse(process.env.FAILURES);
            const count = failures.length;
            const checkedAt = new Date().toUTCString();
            const rows = failures
              .map(f => `| \`${f.id}\` | ${f.url} | ${f.status} |`)
              .join('\n');

            const body = `## ⚠️ ${count} tool${count === 1 ? '' : 's'} returned a non-200 response

            Checked at: **${checkedAt}**

            | Tool ID | URL | Status |
            |---------|-----|--------|
            ${rows}

            ---
            _This issue was created automatically by the [Tool Uptime Check](../../actions/workflows/uptime-check.yml) workflow. It will be closed automatically once all tools pass._`;

            // Look for an existing open uptime issue to update
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime',
              state: 'open',
            });

            if (openIssues.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                title: `🚨 ${count} tool${count === 1 ? '' : 's'} failing uptime check`,
                body,
              });
              console.log(`Updated existing issue #${openIssues[0].number}`);
            } else {
              // Create a new issue
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 ${count} tool${count === 1 ? '' : 's'} failing uptime check`,
                body,
                labels: ['uptime'],
              });
              console.log(`Created issue #${issue.number}: ${issue.html_url}`);
            }
          env:
            FAILURES: ${{ steps.check.outputs.failures }}

      - name: Close resolved uptime issue
        if: steps.check.outputs.failures == ''
        uses: actions/github-script@v7
        with:
          script: |
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime',
              state: 'open',
            });

            for (const issue of openIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ All tools are passing uptime checks as of ${new Date().toUTCString()}. Closing this issue.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed issue #${issue.number}`);
            }
